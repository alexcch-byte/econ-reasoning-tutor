<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Econ Reasoning Tutor</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1c2230;--mute:#5d667a;--line:#dcdfe6;--accent:#1d5fa8;--accent2:#c2410c;--good:#15803d;--bad:#b91c1c;--c1:#1d5fa8;--c2:#c2410c;--c3:#15803d;--c4:#7c3aed;--fill:rgba(29,95,168,.15);--f1:rgba(29,95,168,.22);--f2:rgba(194,65,12,.22);--f3:rgba(21,128,61,.22);--f4:rgba(124,58,237,.20);--fbad:rgba(185,28,28,.26)}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--ink:#e8ebf2;--mute:#9aa3b8;--line:#2e3545;--accent:#6aa9f0;--accent2:#fb923c;--good:#4ade80;--bad:#f87171;--c1:#6aa9f0;--c2:#fb923c;--c3:#4ade80;--c4:#a78bfa;--fill:rgba(106,169,240,.2);--f1:rgba(106,169,240,.25);--f2:rgba(251,146,60,.25);--f3:rgba(74,222,128,.24);--f4:rgba(167,139,250,.24);--fbad:rgba(248,113,113,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
header small{color:var(--mute)}
.layout{display:grid;grid-template-columns:260px 1fr;max-width:1100px;margin:0 auto}
nav{padding:16px;border-right:1px solid var(--line)}
nav button{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
nav .pct{float:right;color:var(--mute);font-size:12px}
main{padding:16px 20px 60px;min-width:0}
.tabs{display:flex;gap:6px;margin:10px 0 16px;flex-wrap:wrap}
.tabs button,.btn{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;font-size:14px}
.tabs button.on,.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
h2{margin:6px 0 2px}h3{margin:18px 0 6px}
.lead{color:var(--mute);margin-top:0}
.key{border-left:3px solid var(--accent2);padding:6px 12px;background:var(--bg);margin:10px 0;border-radius:0 6px 6px 0}
.ctl{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.ctl input{width:100%}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.out div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--mute)}
.out b{display:block;font-size:18px;color:var(--ink)}
canvas{width:100%;height:300px;display:block;margin-bottom:8px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.opt:disabled{cursor:default;color:var(--ink)}.opt.right{border-color:var(--good);background:rgba(34,197,94,.13)}.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.13)}
.fc{height:180px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:20px;cursor:pointer;user-select:none}
.fc.back{font-size:17px;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
input[type=number]{width:90px;padding:4px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media(max-width:760px){.layout{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:6px;padding:10px 16px}nav button{width:auto;white-space:nowrap;margin:0}.ctl{grid-template-columns:110px 1fr 50px}}
</style>
</head>
<body>
<header><h1>Econ Reasoning Tutor</h1><small>Companion to Intro to Economic Reasoning (Barnard/Columbia ECON BC1003)</small></header>
<div class="layout"><nav id="nav"></nav><main id="main"></main></div>

<script>
// ---------- storage ----------
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let progress=store.get('econ-progress',{}); // {modId:{best,total}}

// ---------- chart helper ----------
function css(v){return v&&v.startsWith('--')?getComputedStyle(document.documentElement).getPropertyValue(v).trim():v}
function chart(cv,o){
  cv.style.height=(o.height||300)+'px';
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||600,h=cv.clientHeight||(o.height||300);
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  if(o.bars){
    const pad=12,bw=w-pad*2;
    o.bars.forEach((b,idx)=>{
      const y=18+idx*64;
      g.font='600 12px system-ui';g.fillStyle=css('--ink');g.textAlign='left';g.fillText(b.label,pad,y);
      let cx=pad;const tot=b.total||1;
      b.segs.forEach(s=>{
        if(s.v<=0)return;
        const sw=Math.max(0,(s.v/tot)*bw);
        g.fillStyle=css(s.c);g.fillRect(cx,y+7,sw,26);
        g.strokeStyle=css('--card');g.lineWidth=1.5;g.strokeRect(cx,y+7,sw,26);
        if(sw>58){g.fillStyle='#fff';g.font='600 11px system-ui';g.textAlign='center';g.fillText(s.l,cx+sw/2,y+24)}
        cx+=sw;
      });
    });
    if(o.legend){
      let lx=pad;const ly=h-10;g.font='11px system-ui';
      o.legend.forEach(([l,c])=>{
        g.fillStyle=css(c);g.fillRect(lx,ly-9,10,10);
        g.fillStyle=css('--mute');g.textAlign='left';g.fillText(l,lx+14,ly);
        lx+=24+g.measureText(l).width;
      });
    }
    return;
  }
  const fLabels=(o.fills||[]).filter(f=>f.label);
  const L=48,R=20,T=fLabels.length?28:16,B=38,pw=w-L-R,ph=h-T-B;
  const X=x=>L+x/o.xmax*pw,Y=y=>T+ph-y/o.ymax*ph;
  if(fLabels.length){
    let lx=L;const ly=13;g.font='11px system-ui';
    fLabels.forEach(f=>{
      g.fillStyle=css(f.color);g.fillRect(lx,ly-8,10,10);
      g.strokeStyle=css('--mute');g.lineWidth=.7;g.strokeRect(lx,ly-8,10,10);
      g.fillStyle=css('--mute');g.textAlign='left';g.fillText(f.label,lx+14,ly);
      lx+=24+g.measureText(f.label).width;
    });
  }
  g.font='12px system-ui';g.fillStyle=css('--mute');g.strokeStyle=css('--line');g.lineWidth=1;
  for(let i=0;i<=5;i++){const xv=o.xmax*i/5,yv=o.ymax*i/5;
    g.beginPath();g.moveTo(L,Y(yv));g.lineTo(L+pw,Y(yv));g.moveTo(X(xv),T);g.lineTo(X(xv),T+ph);g.stroke();
    g.textAlign='right';g.fillText(+yv.toFixed(1),L-6,Y(yv)+4);
    g.textAlign='center';g.fillText(+xv.toFixed(1),X(xv),T+ph+16);}
  g.strokeStyle=css('--mute');g.globalAlpha=.45;g.beginPath();g.moveTo(L,T);g.lineTo(L,T+ph);g.lineTo(L+pw,T+ph);g.stroke();g.globalAlpha=1;
  g.fillStyle=css('--mute');g.textAlign='center';g.fillText(o.xl||'',L+pw/2,h-6);
  g.save();g.translate(13,T+ph/2);g.rotate(-Math.PI/2);g.textAlign='center';g.fillText(o.yl||'',0,0);g.restore();

  g.save();g.beginPath();g.rect(L-1,T-1,pw+2,ph+2);g.clip();
  (o.fills||[]).forEach(f=>{if(!f.pts||f.pts.length<3)return;g.fillStyle=css(f.color);g.beginPath();f.pts.forEach((p,i)=>i?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));g.closePath();g.fill()});
  (o.curves||[]).forEach(c=>{g.strokeStyle=css(c.color);g.lineWidth=c.width||2;g.setLineDash(c.dash?(Array.isArray(c.dash)?c.dash:[6,4]):[]);g.beginPath();
    let s=false;c.pts.forEach(p=>{if(!isFinite(p[0])||!isFinite(p[1])){s=false;return}const px=X(p[0]),py=Y(Math.min(Math.max(p[1],-o.ymax*2),o.ymax*4));s?g.lineTo(px,py):g.moveTo(px,py);s=true});g.stroke();g.setLineDash([]);
    if(c.dots){g.fillStyle=css(c.color);c.pts.forEach(p=>{if(p[0]>=0&&p[0]<=o.xmax&&p[1]>=0&&p[1]<=o.ymax){g.beginPath();g.arc(X(p[0]),Y(p[1]),3,0,7);g.fill()}})}});
  (o.points||[]).forEach(p=>{if(p.drop===false||p.x<0||p.x>o.xmax||p.y<0||p.y>o.ymax)return;
    g.setLineDash([3,3]);g.strokeStyle=css('--mute');g.lineWidth=1;g.beginPath();g.moveTo(X(p.x),Y(p.y));g.lineTo(X(p.x),Y(0));g.moveTo(X(p.x),Y(p.y));g.lineTo(X(0),Y(p.y));g.stroke();g.setLineDash([])});
  g.restore();

  const boxes=[];
  function placeLabel(text,px,py,align,color){
    if(!text)return;
    g.font='600 12px system-ui';
    const tw=g.measureText(text).width,th=14;
    let lx=align==='right'?px-tw:align==='center'?px-tw/2:px;
    lx=Math.max(L+3,Math.min(lx,L+pw-tw-3));
    let ly=Math.max(T+th,Math.min(py,T+ph-4));
    for(const off of[0,-15,15,-30,30,-45,45]){
      const ty=ly+off;
      if(ty<T+th-1||ty>T+ph-2)continue;
      if(!boxes.some(b=>lx<b.x+b.w+4&&lx+tw+4>b.x&&ty-th<b.y&&ty>b.y-b.h)){ly=ty;break}
    }
    boxes.push({x:lx,y:ly,w:tw,h:th});
    g.fillStyle=css('--card');g.globalAlpha=.82;g.fillRect(lx-2,ly-th+2,tw+4,th);g.globalAlpha=1;
    g.fillStyle=color;g.textAlign='left';g.fillText(text,lx,ly);
  }
  function ptAtX(pts,x){
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1];
      if(isFinite(a[1])&&isFinite(b[1])&&((a[0]<=x&&x<=b[0])||(b[0]<=x&&x<=a[0]))){
        const t=b[0]===a[0]?0:(x-a[0])/(b[0]-a[0]);
        return[x,a[1]+t*(b[1]-a[1])];
      }
    }
    return null;
  }
  (o.curves||[]).forEach(c=>{
    if(!c.label)return;
    const q=c.pts.filter(p=>isFinite(p[0])&&isFinite(p[1])&&p[1]>=0&&p[1]<=o.ymax&&p[0]>=0&&p[0]<=o.xmax);
    let e=c.lx!=null?ptAtX(c.pts,c.lx):null;
    if(!e||e[1]<0||e[1]>o.ymax||e[0]<0||e[0]>o.xmax)e=q[q.length-1];
    if(!e)return;
    placeLabel(c.label,X(e[0])-4,Y(e[1])-6,'right',css(c.color));
  });
  (o.points||[]).forEach(p=>{
    if(p.x<0||p.x>o.xmax||p.y<0||p.y>o.ymax)return;
    g.fillStyle=css(p.color||'--ink');g.strokeStyle=css('--card');g.lineWidth=2;
    g.beginPath();g.arc(X(p.x),Y(p.y),4.5,0,7);g.fill();g.stroke();
    if(p.label){
      const rightSide=X(p.x)>L+pw*0.78;
      placeLabel(p.label,rightSide?X(p.x)-8:X(p.x)+8,Y(p.y)-7,rightSide?'right':'left',css(p.color||'--ink'));
    }
  });
}
const line=(f,x0,x1,n=60)=>Array.from({length:n+1},(_,i)=>{const x=x0+(x1-x0)*i/n;return[x,f(x)]});

// ---------- widget helpers ----------
function el(html){const d=document.createElement('div');d.innerHTML=html;return d}
let uidN=0,resizers=[];
window.addEventListener('resize',()=>resizers.forEach(f=>f()));
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>resizers.forEach(f=>f()));
function widget(host,{controls,compute,draw,outs,extra}){
  const vals={};const box=el('<div class="card"></div>').firstChild;host.appendChild(box);
  const cv=draw?el('<canvas role="img" aria-label="Interactive chart; key numbers are listed below it"></canvas>').firstChild:null;
  const out=el('<div class="out"></div>').firstChild,note=el('<div class="key" style="display:none"></div>').firstChild;
  const ctl=el('<div></div>');
  controls.forEach(c=>{vals[c.id]=c.v;
    if(c.opts){const rw=el(`<div class="ctl"><label>${c.l}</label><div class="row" role="group" aria-label="${c.l}"></div><span></span></div>`);const g=rw.querySelector('.row');c.opts.forEach(([lab,val])=>{const bt=el(`<button class="btn${val===c.v?' primary':''}" aria-pressed="${val===c.v}">${lab}</button>`).firstChild;bt.onclick=()=>{vals[c.id]=val;g.querySelectorAll('button').forEach(x=>{x.classList.remove('primary');x.setAttribute('aria-pressed','false')});bt.classList.add('primary');bt.setAttribute('aria-pressed','true');update()};g.appendChild(bt)});ctl.appendChild(rw);return}
    const uid='s'+(++uidN);const r=el(`<div class="ctl"><label for="${uid}">${c.l}</label><input id="${uid}" type="range" min="${c.min}" max="${c.max}" step="${c.step||1}" value="${c.v}"><span aria-hidden="true">${c.v}</span></div>`);
    const inp=r.querySelector('input'),sp=r.querySelector('span');
    inp.oninput=()=>{vals[c.id]=+inp.value;sp.textContent=inp.value;update()};ctl.appendChild(r)});
  if(cv)box.append(cv);
  const extraEl=el('<div></div>').firstChild;box.append(ctl,out,note,extraEl);
  function update(){const r=compute(vals);if(draw&&cv)chart(cv,draw(vals,r));
    out.innerHTML=outs(vals,r).map(o=>`<div>${o[0]}<b>${o[1]}</b></div>`).join('');
    if(extra)extraEl.innerHTML=extra(vals,r);
    if(r.note){note.style.display='block';note.textContent=r.note}else note.style.display='none'}
  resizers.push(update);setTimeout(update,0);
  return box;
}
const f1=n=>(Math.round(n*10)/10).toLocaleString();
const f0=n=>Math.round(n).toLocaleString();
const money=k=>k>=1e6?'$'+f1(k/1e6)+'b':k>=1e3?'$'+f1(k/1e3)+'m':'$'+f1(k)+'k';
const times=x=>x>=100?'about '+Math.round(x).toLocaleString()+'×':f1(x)+'×';

// ---------- explore widgets ----------
const W={
budget(h){
  h.appendChild(el('<h3>Budget line &amp; optimal choice</h3><p class="lead">Spend income on goods X and Y. The consumer maximizes utility U = X<sup>α</sup>Y<sup>1−α</sup>. Change prices and income and watch the optimum and the indifference curve move.</p>'));
  widget(h,{controls:[{id:'I',l:'Income ($)',min:20,max:200,v:100,step:5},{id:'px',l:'Price of X',min:1,max:20,v:5},{id:'py',l:'Price of Y',min:1,max:20,v:10},{id:'a',l:'Taste for X (α)',min:.1,max:.9,step:.05,v:.5}],
   compute:v=>{const x=v.a*v.I/v.px,y=(1-v.a)*v.I/v.py;return{x,y,u:Math.pow(x,v.a)*Math.pow(y,1-v.a),note:`Opportunity cost of one X = ${f1(v.px/v.py)} units of Y. At the optimum, MU_x/P_x = MU_y/P_y (the marginal rate of substitution equals the price ratio).`}},
   draw:(v,r)=>{
     const xm=Math.max(40,Math.ceil(v.I/v.px*1.1/10)*10),ym=Math.max(25,Math.ceil(v.I/v.py*1.1/5)*5);
     const indPts=Array.from({length:160},(_,i)=>{const x=Math.max(.02,Math.pow((i+1)/160,1.8)*xm);return[x,Math.pow(r.u/Math.pow(x,v.a),1/(1-v.a))]});
     const moved=v.I!==100||v.px!==5||v.py!==10;
     return{xmax:xm,ymax:ym,xl:'Good X',yl:'Good Y',
       fills:[{pts:[[0,0],[0,v.I/v.py],[v.I/v.px,0]],color:'--fill',label:'Affordable set'}],
       curves:[
         ...(moved?[{pts:[[0,10],[20,0]],color:'--mute',label:'Initial budget',dash:[3,3],width:1.5,lx:16}]:[]),
         {pts:[[0,v.I/v.py],[v.I/v.px,0]],color:'--c1',label:'Budget',lx:v.I/v.px*.85},
         {pts:indPts,color:'--c2',label:'Indifference (U)',dash:1,lx:Math.min(xm*.9,r.x*1.6)}
       ],
       points:[{x:r.x,y:r.y,label:'Optimum'}]}},
   outs:(v,r)=>[['Best X',f1(r.x)],['Best Y',f1(r.y)],['Utility',f1(r.u)]]});
},
advantage(h){
  h.appendChild(el('<h3>Comparative advantage &amp; joint PPF</h3><p class="lead">Output per hour (assuming 1 hour each). Who should specialize in what? Compare <i>opportunity costs</i>, not raw productivity, and see how specialization bows out their combined frontier.</p>'));
  const b=el(`<div class="card"><canvas role="img" aria-label="Joint production possibilities frontier for Ana and Ben"></canvas><table><tr><th></th><th>Coffee / hr</th><th>Bread / hr</th><th>Opp. cost of 1 coffee</th><th>Opp. cost of 1 bread</th></tr>
  <tr><td>Ana</td><td><input type=number id=ac value=6></td><td><input type=number id=ab value=3></td><td id=a1></td><td id=a2></td></tr>
  <tr><td>Ben</td><td><input type=number id=bc value=2></td><td><input type=number id=bb value=2></td><td id=b1></td><td id=b2></td></tr></table><div class="key" id=adv></div></div>`).firstChild;
  h.appendChild(b);
  const cv=b.querySelector('canvas'),q=s=>b.querySelector(s),upd=()=>{const[ac,ab,bc,bb]=['ac','ab','bc','bb'].map(i=>+q('#'+i).value);
    if(![ac,ab,bc,bb].every(x=>x>0)){['#a1','#a2','#b1','#b2'].forEach(s=>q(s).textContent='–');q('#adv').textContent='Enter output per hour greater than zero for every cell.';return}
    const a1=ab/ac,a2=ac/ab,b1=bb/bc,b2=bc/bb;q('#a1').textContent=f1(a1)+' bread';q('#a2').textContent=f1(a2)+' coffee';q('#b1').textContent=f1(b1)+' bread';q('#b2').textContent=f1(b2)+' coffee';
    const anaC=a1<=b1,kx=anaC?ac:bc,ky=anaC?bb:ab,totC=ac+bc,totB=ab+bb;
    chart(cv,{height:240,xmax:Math.max(10,Math.ceil(totC*1.15)),ymax:Math.max(6,Math.ceil(totB*1.15)),xl:'Total Coffee (per hr)',yl:'Total Bread (per hr)',
      fills:[{pts:[[0,0],[0,totB],[kx,ky],[totC,0]],color:'--fill',label:'Joint feasible set'}],
      curves:[
        {pts:[[0,totB],[kx,ky],[totC,0]],color:'--c1',label:'Combined PPF',lx:totC*.85},
        {pts:[[0,ab],[ac,0]],color:'--c2',dash:1,label:'Ana alone',lx:ac*.75},
        {pts:[[0,bb],[bc,0]],color:'--c3',dash:1,label:'Ben alone',lx:bc*.75}
      ],
      points:a1===b1?[]:[{x:kx,y:ky,label:'Specialization kink'}]});
    q('#adv').textContent=a1===b1?'Identical opportunity costs: no gains from trade.':(a1<b1?'Ana':'Ben')+' has the comparative advantage in coffee (lower opportunity cost); '+(a1<b1?'Ben':'Ana')+' in bread. Both gain if each specializes at the kink ('+f1(kx)+' coffee, '+f1(ky)+' bread) and trades at a price of coffee between '+f1(Math.min(a1,b1))+' and '+f1(Math.max(a1,b1))+' bread.'};
  const nm={ac:'Ana coffee per hour',ab:'Ana bread per hour',bc:'Ben coffee per hour',bb:'Ben bread per hour'};
  b.querySelectorAll('input').forEach(i=>{i.setAttribute('aria-label',nm[i.id]);i.oninput=upd});
  resizers.push(upd);setTimeout(upd,0);
},
subincome(h){
  h.appendChild(el('<h3>Substitution &amp; income effects</h3><p class="lead">When the price of Good X changes from $10 to P<sub>x</sub> (with I = $100, P<sub>y</sub> = $10, α = 0.5), the total change in X splits into the <b>substitution effect</b> (moving along the initial indifference curve to match the new price ratio) and the <b>income effect</b> (moving to the new indifference curve).</p>'));
  widget(h,{controls:[{id:'px',l:'New Price of X',min:2,max:20,v:4,step:1},{id:'a',l:'Taste for X (α)',min:.2,max:.8,step:.1,v:.5}],
   compute:v=>{
     const I=100,px0=10,py=10,x0=v.a*I/px0,y0=(1-v.a)*I/py,u0=Math.pow(x0,v.a)*Math.pow(y0,1-v.a);
     const x1=v.a*I/v.px,y1=(1-v.a)*I/py,u1=Math.pow(x1,v.a)*Math.pow(y1,1-v.a);
     const xs=u0*Math.pow(v.a*py/((1-v.a)*v.px),1-v.a),ys=u0*Math.pow((1-v.a)*v.px/(v.a*py),v.a);

nash(h){
  h.appendChild(el('<h3>Nash equilibrium in three games</h3><p class="lead">Each cell shows (Firm A payoff, Firm B payoff). A payoff is <u>underlined</u> when that firm\'s choice is its best reply to the other firm\'s choice. A shaded cell with both payoffs underlined is a <b>Nash equilibrium</b>: nobody wants to switch alone.</p>'));
  const G=[
   {acts:['Cooperate','Cheat'],P:[[[10,10],[2,15]],[[15,2],[5,5]]],txt:'Prisoners\' dilemma: Cheat is the best reply to anything, so (Cheat, Cheat) is the only equilibrium, even though (Cooperate, Cooperate) pays both more.'},
   {acts:['Standard 1','Standard 2'],P:[[[10,10],[0,0]],[[0,0],[6,6]]],txt:'Coordination game: two equilibria. Once both firms pick the same standard, neither wants to switch alone, even at (Standard 2, Standard 2), which pays less. A Nash equilibrium need not be the best outcome, and need not be unique.'},
   {acts:['Enter','Stay out'],P:[[[-5,-5],[10,0]],[[0,10],[0,0]]],txt:'Entry game: two equilibria, in each exactly one firm enters. If both enter, both lose, so each would rather stay out. The payoffs alone do not say which firm ends up entering (it often depends on who commits first).'}];
  widget(h,{controls:[{id:'g',l:'Game',opts:[['Prisoners\' dilemma',0],['Coordination game',1],['Entry game',2]],v:0}],
   compute:v=>{const g=G[v.g],aB=[0,1].map(i=>[0,1].map(j=>g.P[i][j][0]>=g.P[1-i][j][0])),bB=[0,1].map(i=>[0,1].map(j=>g.P[i][j][1]>=g.P[i][1-j][1])),ne=[];
     for(let i=0;i<2;i++)for(let j=0;j<2;j++)if(aB[i][j]&&bB[i][j])ne.push(`(${g.acts[i]}, ${g.acts[j]})`);
     return{g,aB,bB,list:ne.join(' and ')||'none',note:g.txt}},
   outs:(v,r)=>[['Nash equilibria',r.list]],
   extra:(v,r)=>{const g=r.g,u=(x,b)=>b?'<u>'+x+'</u>':x;
     const cell=(i,j)=>{const p=g.P[i][j],ne=r.aB[i][j]&&bB_ok(r,i,j);return`<td style="${ne?'background:var(--fill);font-weight:600':''}">${u(p[0],r.aB[i][j])}, ${u(p[1],r.bB[i][j])}</td>`};
     function bB_ok(r,i,j){return r.bB[i][j]}
     return`<table style="margin-top:10px;max-width:460px"><tr><th>A \\ B</th><th>B: ${g.acts[0]}</th><th>B: ${g.acts[1]}</th></tr><tr><th>A: ${g.acts[0]}</th>${cell(0,0)}${cell(0,1)}</tr><tr><th>A: ${g.acts[1]}</th>${cell(1,0)}${cell(1,1)}</tr></table>`}});
},

{id:'m1',title:'1. Constraints & Preferences',topic:'Individual constraints and preferences',
 learn:`<h2>Constraints &amp; Preferences</h2><p class="lead">Economics is the study of how people make choices under scarcity.</p>
 <h3>Scarcity and opportunity cost</h3><p>Resources are limited but wants are not, so every choice has a cost: the <b>opportunity cost</b> is the value of the best alternative given up. Costs are always about forgone alternatives, not just dollars.</p>
 <div class="key">Thinking at the margin: rational decisions compare marginal benefit with marginal cost. Sunk costs (already spent, unrecoverable) should be ignored.</div>
 <h3>The budget constraint</h3><p>With income I and prices P<sub>x</sub>, P<sub>y</sub>, affordable bundles satisfy P<sub>x</sub>X + P<sub>y</sub>Y ≤ I. The slope of the budget line is −P<sub>x</sub>/P<sub>y</sub>, the opportunity cost of X in terms of Y. A rise in income shifts the line out in parallel; a price change rotates it.</p>
 <h3>Preferences and utility</h3><p><b>Utility</b> represents satisfaction. <b>Diminishing marginal utility</b>: each additional unit adds less than the one before. <b>Indifference curves</b> connect bundles giving equal utility; they slope down, don't cross, and are convex. The consumer picks the affordable bundle on the highest indifference curve, where MRS = P<sub>x</sub>/P<sub>y</sub>.</p>
 <h3>Gains from trade</h3><p>Production possibilities frontier (PPF): the max combinations of two goods an economy can produce. Points inside are inefficient; outside, unattainable. <b>Comparative advantage</b> (lowest opportunity cost) – not absolute advantage – determines who should specialize, and trade lets everyone consume beyond their own PPF.</p>
 <h3>Individual demand</h3><p>Changing a price and tracing the best choices gives the demand curve. A price change has a <b>substitution effect</b> (relative price changed) and an <b>income effect</b> (purchasing power changed).</p>`,

{id:'m2',title:'2. Production by Firms',topic:'Production by firms',
 learn:`<h2>Production by Firms</h2><p class="lead">Firms turn inputs (labor, capital, materials) into goods and services, aiming to maximize profit.</p>
 <h3>Production and diminishing returns</h3><p>In the short run at least one input (capital) is fixed. Adding workers raises output, but the <b>marginal product of labor</b> eventually falls: <b>diminishing marginal returns</b>. In the long run all inputs can vary.</p>
 <h3>Costs</h3><p><b>Fixed costs</b> don't vary with output; <b>variable costs</b> do. <b>Marginal cost</b> (MC) = extra cost of one more unit. Average total cost (ATC) = TC/q. MC rises with output (diminishing returns) and crosses ATC and AVC at their minimum points.</p>
 <div class="key">Economic profit = revenue − all opportunity costs (including the owner's time and capital). A firm with zero economic profit is still earning a normal return.</div>
 <h3>Profit maximization</h3><p>Produce until <b>MR = MC</b>. For a price taker, MR = P. If P &lt; AVC, shut down in the short run; in the long run exit if P &lt; ATC.</p>
 <h3>Economies of scale</h3><p>Long-run ATC may fall (economies of scale), be flat (constant returns), or rise (diseconomies of scale). Scale economies explain why some industries have few large firms.</p>`,
 explore:['production','costs','scale'],
 quiz:[
 {q:'A price-taking firm maximizes profit by producing where:',o:['P = ATC','P = MC','MC is minimized','TR is maximized'],a:1,e:'Marginal revenue equals price; produce until the marginal cost of the next unit equals P.'},
 {q:'The marginal cost curve intersects the ATC curve:',o:['At ATC\'s minimum','Before ATC\'s minimum','At the maximum of ATC','Never'],a:0,e:'When MC is below ATC it pulls the average down; above, it pulls it up – so they cross at the minimum.'},
 {q:'In the short run, a firm should shut down if:',o:['It has negative economic profit','P < ATC','P < AVC','Fixed costs are large'],a:2,e:'If revenue does not even cover variable cost, producing adds to losses; fixed costs are paid regardless.'},
 {q:'Diminishing marginal returns means:',o:['Total output falls once more workers are added','Each added worker adds less output than the last one','Average costs fall as output rises','Firms should stop hiring workers'],a:1,e:'Total output may still rise, but at a slower rate.'},
 {q:'A baker runs a bakery that earns $60k in accounting profit (after paying all explicit costs, but she pays herself nothing). She could earn $70k as an employee elsewhere. Her economic profit is:',o:['$60k','$10k','−$10k','$0'],a:2,e:'Subtract the opportunity cost of her labor: 60 − 70 = −10.'},

{id:'m3',title:'3. Market Transactions',topic:'Market transactions',
 learn:`<h2>Market Transactions</h2><p class="lead">Markets coordinate millions of decisions through prices.</p>
 <h3>Demand and supply</h3><p>The <b>law of demand</b>: higher price → lower quantity demanded. The <b>law of supply</b>: higher price → higher quantity supplied. Equilibrium is where quantity demanded = quantity supplied. Price changes cause movements <i>along</i> curves; changes in income, tastes, related-goods prices, expectations, number of buyers shift demand; input costs, technology, taxes, number of sellers shift supply.</p>
 <div class="key">Shortage: price below equilibrium (Qd &gt; Qs). Surplus: price above equilibrium (Qs &gt; Qd). Prices adjust to eliminate them.</div>
 <h3>Elasticity</h3><p>Price elasticity of demand = %ΔQ / %ΔP. |E|&gt;1 elastic, |E|&lt;1 inelastic. More substitutes, more luxury-like, and longer time horizon → more elastic. If demand is elastic, raising price reduces total revenue; if inelastic, revenue rises. Income elasticity &gt; 0 for normal goods, &lt; 0 for inferior goods. Cross-price elasticity &gt; 0 for substitutes, &lt; 0 for complements.</p>
 <h3>Welfare</h3><p><b>Consumer surplus</b> = willingness to pay − price paid. <b>Producer surplus</b> = price received − cost. The competitive equilibrium maximizes total surplus.</p>
 <h3>Interventions</h3><p><b>Price ceiling</b> below equilibrium → shortage (e.g. rent control). <b>Price floor</b> above equilibrium → surplus (e.g. minimum wage, if binding). <b>Taxes</b> drive a wedge between buyer and seller prices, shrink the market, and create deadweight loss; the burden falls more on the less elastic side.</p>`,

{id:'m4',title:'4. Competition',topic:'Competition',
 learn:`<h2>Competition &amp; Market Structure</h2><p class="lead">How much competition a firm faces shapes prices, output, and efficiency.</p>
 <h3>Perfect competition</h3><p>Many small sellers, identical product, free entry/exit, price takers. Firms produce where P = MC. Short-run profits attract entry, driving price down until <b>economic profit = 0</b> in the long run (P = min ATC). Outcome: allocatively efficient (P = MC) and productively efficient.</p>
 <h3>Monopoly</h3><p>One seller, barriers to entry (patents, scale, control of resources). To sell more it must cut price on all units, so MR &lt; P. Produce where MR = MC, charge the price on the demand curve at that quantity. Result: higher price, lower quantity than competition, profit, and <b>deadweight loss</b>. Governments respond with antitrust, regulation, and patents (which also reward innovation).</p>
 <h3>Monopolistic competition &amp; oligopoly</h3><p><b>Monopolistic competition</b>: many firms, differentiated products (restaurants); zero long-run profit but P &gt; MC. <b>Oligopoly</b>: few interdependent firms; strategic behavior and game theory. Collusion (cartels) is tempting but unstable – the <b>prisoners' dilemma</b> – because each firm gains by cheating.</p>
 <h3>Nash equilibrium</h3><p>A <b>Nash equilibrium</b> is a set of choices in which each player's choice is the best reply to what the others are doing, so nobody gains by switching alone. In the prisoners' dilemma it is (Cheat, Cheat). It is not always the best outcome for the players, and a game can have more than one (for example, firms choosing a common technology standard). When the game is <b>repeated</b>, the threat of future punishment can sustain cooperation.</p>
 <div class="key">Price discrimination: charging different customers different prices based on willingness to pay raises profit and can reduce deadweight loss.</div>`,

{id:'m5',title:'5. Income Distribution',topic:'Income distribution',
 learn:`<h2>Income Distribution</h2><p class="lead">Who gets what: the economics of inequality and poverty.</p>
 <h3>Factor markets</h3><p>Incomes come from selling labor (wages), capital (interest/profit), and land (rent). Firms hire workers until the <b>value of marginal product</b> equals the wage, so wages reflect productivity, which depends on skills, education, and experience (<b>human capital</b>).</p>
 <h3>Measuring inequality</h3><p>The <b>Lorenz curve</b> plots cumulative income share against cumulative population share. The further it bows from the 45° line, the more unequal. The <b>Gini coefficient</b> (area between the line and the curve, scaled) runs from 0 to 1. Poverty is measured with a threshold: the poverty rate is the share of people below it.</p>
 <h3>Causes</h3><p>Differences in education and skills, skill-biased technological change, globalization, discrimination, inheritance, market power, family structure, and labor-market institutions (unions, minimum wage).</p>
 <h3>Equity vs. efficiency</h3><p>Redistribution through progressive taxes and transfers can reduce poverty but may blunt incentives to work and invest. Economics can describe tradeoffs; how much equality to buy is a value judgment. Wealth (assets) is distributed more unequally than income.</p>
 <div class="key">Progressive tax: the average rate rises with income. Regressive: falls. Proportional (flat): constant.</div>`,

 {q:'Skill-biased technological change tends to:',o:['Reduce the wage premium for skills','Increase the wage gap between skilled and unskilled','Eliminate inequality','Reduce productivity'],a:1,e:'It raises demand for skilled workers relative to unskilled.'},

 {q:'Redistribution may reduce efficiency because it:',o:['Always reduces total output','May weaken incentives to work and invest','Always raises prices for goods','Eliminates private markets'],a:1,e:'The equity–efficiency tradeoff.'}],

{id:'m6',title:'6. Technology & Growth',topic:'Technological progress and growth',
 learn:`<h2>Technological Progress &amp; Growth</h2><p class="lead">Long-run living standards depend on productivity growth.</p>
 <h3>GDP</h3><p><b>Gross domestic product</b> = market value of final goods and services produced within a country in a year. By expenditure: <b>GDP = C + I + G + NX</b>. <b>Real GDP</b> adjusts for inflation; <b>nominal GDP</b> does not. Growth in real GDP per capita measures improvement in average living standards (with caveats: no value for leisure, home production, environment, distribution).</p>
 <h3>Sources of growth</h3><p>Output per worker rises with more <b>physical capital</b>, more <b>human capital</b>, better <b>technology</b> (total factor productivity), and good institutions (property rights, rule of law). Capital faces diminishing returns, so sustained growth comes mainly from technological progress. Poorer countries tend to grow faster (<b>convergence</b>) if they have good institutions.</p>
 <h3>Why compounding matters</h3><p>At 2% growth, income doubles in 35 years; at 7%, in 10. Over generations tiny differences create vast gaps (rule of 70).</p>
 <h3>Innovation</h3><p>Ideas are non-rival: one person's use does not prevent another's, so there are increasing returns to ideas. Patents create incentives to innovate but create temporary monopolies. Technology also causes <b>creative destruction</b>: new industries replace old.</p>
 <h3>Capital accumulation: a simple picture</h3><p>Each year workers save a share <b>s</b> of output, and that saving becomes new capital (investment). But capital wears out: <b>depreciation</b> removes a share δ of it each year. Capital per worker rises while saving per worker exceeds depreciation and settles at a <b>steady state</b> where the two are equal. Because of diminishing returns, each extra unit of capital adds less output, so growth from capital alone fades out. A higher saving rate lifts the <i>level</i> of income per worker but not its long-run growth rate; only continuing technological progress keeps income per worker growing.</p>
 <div class="key">Saving → investment → capital. Higher saving raises the level of income, but only innovation sustains long-run growth per worker.</div>`,

 {q:'Which is part of U.S. GDP?',o:['A used car sold in resale','A new car built in Ohio by a Japanese firm','Trades on the stock market','The housework you do at home'],a:1,e:'GDP counts final goods produced within the country\'s borders, regardless of owner nationality.'},
 {q:'GDP = C + I + G + NX. NX equals:',o:['Exports minus imports','Exports plus imports','Imports minus exports','Net income'],a:0,e:'Net exports.'},
 {q:'At 3.5% annual growth, income doubles in about:',o:['7 years','20 years','35 years','70 years'],a:1,e:'Rule of 70: 70/3.5 = 20.'},

 {q:'Ideas being "non-rival" means:',o:['They are protected by patents','Many people can use one idea at once','They are free to produce and share','They cannot be bought or sold'],a:1,e:'Use by one doesn\'t reduce use by another, leading to increasing returns.'},

{id:'m7',title:'7. Unemployment & Inflation',topic:'Unemployment and inflation',
 learn:`<h2>Unemployment &amp; Inflation</h2><p class="lead">Two headline macro problems: wasted labor and a falling value of money.</p>
 <h3>Unemployment</h3><p>Labor force = employed + unemployed (looking for work). <b>Unemployment rate</b> = unemployed / labor force. Participation rate = labor force / adult population. Types: <b>frictional</b> (job search), <b>structural</b> (skills mismatch), <b>cyclical</b> (recessions). The <b>natural rate</b> = frictional + structural. Costs: lost output (Okun's law), lost skills, hardship.</p>
 <h3>Inflation</h3><p><b>Inflation</b> is the rate of increase of the general price level, measured by the <b>CPI</b> (cost of a fixed market basket relative to base year). Biases: substitution, new goods, quality change. Real = nominal adjusted for inflation: real wage ≈ nominal wage − inflation; <b>real interest rate ≈ nominal − expected inflation</b>.</p>
 <h3>Costs of inflation</h3><p>Unanticipated inflation redistributes from lenders to borrowers, creates uncertainty, "menu costs", and "shoe-leather costs". Hyperinflation destroys the monetary system.</p>
 <h3>Aggregate demand and supply</h3><p>AD falls with the price level; short-run AS slopes upward. Demand shocks move output and prices in the <i>same</i> direction; supply shocks (oil) move them in <i>opposite</i> directions (stagflation). The short-run <b>Phillips curve</b> shows a tradeoff between inflation and unemployment; in the long run, it's vertical at the natural rate, so expectations matter. In the long run wages and prices adjust, so output returns to potential (long-run AS is vertical): a demand boom then leaves only a higher price level. If people come to expect the inflation, the short-run Phillips curve shifts up and the tradeoff disappears.</p>
 <div class="key">Money &amp; the Fed: the central bank controls the money supply and short-term interest rates. Expansionary policy lowers rates, boosting AD; contractionary policy fights inflation.</div>`,

 quiz:[
 {q:'A student who stops looking for work after months of failed search is:',o:['Unemployed','Employed','Not in the labor force','Frictionally unemployed'],a:2,e:'Discouraged workers leave the labor force.'},

 {q:'Unemployment because of a recession is:',o:['Frictional','Structural','Cyclical','Natural'],a:2,e:'It moves with the business cycle.'},
 {q:'Nominal interest 6%, expected inflation 2%. Real interest rate ≈',o:['8%','4%','3%','2%'],a:1,e:'Fisher relation: real ≈ nominal − expected inflation.'},
 {q:'Oil prices spike, shifting SRAS left. The result is:',o:['Higher output and prices','Lower output and higher prices','Lower output and prices','Higher output, lower prices'],a:1,e:'Stagflation.'},
 {q:'Unexpectedly high inflation tends to benefit:',o:['Lenders with fixed-rate loans','Borrowers with fixed-rate loans','Savers','Retirees on fixed pensions'],a:1,e:'Borrowers repay in cheaper dollars.'},
 {q:'The long-run Phillips curve is:',o:['Downward sloping','Upward sloping','Vertical at the natural rate','Horizontal'],a:2,e:'There is no permanent tradeoff.'},
 {q:'A sharp fall in consumer confidence shifts aggregate demand left. In the short run:',o:['Output and the price level both fall','Output falls and the price level rises','Output rises and the price level falls','Only the price level changes'],a:0,e:'Moving down along an upward-sloping SRAS curve lowers both output and prices.'},

 {q:'After people come to expect the higher inflation, the Phillips curve tradeoff:',o:['Becomes upward sloping, so inflation and unemployment rise together','Shifts up: unemployment returns to the natural rate but inflation stays higher','Disappears, and inflation falls back to zero with unemployment unchanged','Does not change, because expectations are irrelevant to inflation'],a:1,e:'Higher expected inflation shifts the short-run curve up. Unemployment returns to the natural rate with inflation left higher.'}],

{id:'m8',title:'8. The Government',topic:"The government's role in the economy",
 learn:`<h2>The Government's Role</h2><p class="lead">When do markets fail, and what can policy do?</p>
 <h3>Market failures</h3><ul><li><b>Externalities</b>: costs or benefits to third parties (pollution, vaccination). Fix with <b>Pigouvian taxes/subsidies</b>, regulation, or tradable permits.</li><li><b>Public goods</b>: non-excludable and non-rival (national defense); the <b>free-rider</b> problem means markets underprovide them.</li><li><b>Market power</b> (antitrust) and <b>asymmetric information</b> (adverse selection, moral hazard, e.g. insurance).</li></ul>
 <h3>Redistribution &amp; taxes</h3><p>Taxes and transfers address equity; good taxes are simple, broad-based, and distort little. Distortions are larger when supply or demand is elastic.</p>
 <h3>Fiscal policy</h3><p>Government spending and taxes. Expansionary policy (higher G or lower T) boosts AD in recessions; the <b>multiplier</b> = 1/(1−MPC) in the simple model. Budget deficits add to the <b>national debt</b>; large debt can crowd out private investment. <b>Automatic stabilizers</b> (progressive taxes, unemployment insurance) work without new laws.</p>
 <h3>Monetary policy</h3><p>The central bank sets interest rates and money supply. Lower rates → more investment and consumption → higher AD. Limitations: lags, zero lower bound, and credibility.</p>
 <h3>Money, banks, and the central bank</h3><p><b>Money</b> is a medium of exchange, a unit of account, and a store of value. Banks take deposits and lend most of them out, keeping a fraction as <b>reserves</b>. Because loans become new deposits elsewhere, a deposit of D can support total deposits of up to D ÷ (reserve ratio). The <b>money multiplier</b> is 1 ÷ (reserve ratio); in practice it is smaller because banks hold extra reserves and people hold cash.</p>
 <p>The central bank (the Fed) steers interest rates with <b>open market operations</b> (buying or selling government bonds), the <b>discount rate</b> it charges banks, the <b>reserve requirement</b> (set to 0% in 2020, so it is no longer an active tool in the US), and, today, the interest it pays on bank reserves. Buying bonds adds reserves and pushes interest rates down; selling bonds does the opposite.</p>
 <p><b>Bond prices and interest rates move in opposite directions.</b> A bond that pays $100 in a year sells for 100 ÷ (1 + r): $96.15 at r = 4% and $90.91 at r = 10%. When rates rise, existing bonds lose value.</p>
 <div class="key">Government failure is also possible: rent-seeking, poor information, political incentives. The question is rarely market vs. government but which imperfect institution does better.</div>`,

 {q:'A factory\'s pollution harms neighbors. This is a:',o:['Public good','Negative externality','Positive externality','Monopoly'],a:1,e:'A cost imposed on third parties.'},

 {q:'MPC = 0.8. The simple spending multiplier is:',o:['0.8','1.8','4','5'],a:3,e:'1 / (1 − 0.8) = 5.'},
 {q:'With a negative externality, a Pigouvian tax should equal:',o:['Total revenue','The marginal external cost','The producer surplus','Zero'],a:1,e:'It makes private decisions reflect social costs.'},

 {q:'People who know they are sick are the most eager to buy health insurance, so insurers end up with a sicker pool than expected. This is:',o:['Moral hazard','Adverse selection','Free riding','Crowding out'],a:1,e:'Hidden information before the transaction.'},

{id:'m9',title:'9. Trade & Exchange Rates',topic:'International trade (extra: beyond the listed topics)',
 learn:`<h2>International Trade &amp; Exchange Rates</h2><p class="lead">Not on the official topic list, but a standard part of peer intro courses: how trade, tariffs and currency prices affect a country.</p>
 <h3>Why countries trade</h3><p>Comparative advantage (module 1) works between countries as well as people: each country specializes in what it makes at the lowest opportunity cost, and trade lets both consume beyond what they could produce alone. The gains are real but uneven: consumers and exporters gain, while workers and firms that compete with imports can lose.</p>
 <h3>Tariffs and quotas</h3><p>A <b>tariff</b> is a tax on imports; a <b>quota</b> limits the quantity imported. Either one raises the domestic price above the world price. Domestic producers gain, consumers lose by more, and the total falls by a <b>deadweight loss</b>. With a tariff the government collects revenue; with a quota, whoever holds the import licenses captures the extra margin instead. The Explore model assumes a small country that takes the world price as given.</p>
 <div class="key">Tariffs help a small, concentrated group (import-competing producers) at the expense of a larger, scattered group (consumers). That is why they persist even though they lower total surplus.</div>
 <h3>Exchange rates and the trade balance</h3><p>The <b>exchange rate</b> is the price of one currency in terms of another. When the dollar <b>appreciates</b>, US goods cost foreigners more and foreign goods cost Americans less, so exports tend to fall and imports to rise. <b>Net exports</b> NX = exports − imports. A trade <b>deficit</b> (NX &lt; 0) is matched by a net inflow of foreign lending and investment; it is not automatically good or bad.</p>`,
 explore:['tariff','fx'],
 quiz:[
 {q:'Countries gain from trade mainly because:',o:['One trading country always gains at the expense of the other','Each specializes where its opportunity cost is lower, so both can end up with more','Each country\'s exports must always exceed its imports','Trade removes the need for countries to produce anything'],a:1,e:'Specialization by comparative advantage lets both sides end up with more.'},
 {q:'A country that buys steel at the world price adds a tariff on imported steel. Who gains?',o:['Domestic steel buyers and users','Domestic steel producers and the government','Foreign steel producers selling to us','No one gains from the tariff'],a:1,e:'The home price rises, so domestic producers earn more and the government collects tariff revenue. Domestic buyers lose.'},
 {q:'Compared with free trade, a tariff on an imported good usually:',o:['Raises total surplus for the country','Lowers total surplus because of deadweight loss','Leaves total surplus for the country unchanged','Lowers the price paid by domestic buyers'],a:1,e:'Some mutually beneficial trades no longer happen, and the home country produces some units at a higher cost than the world price.'},
 {q:'Under free trade a country imports 60 units. A $10 per-unit tariff cuts imports to 30 units. Tariff revenue is:',o:['$10','$300','$600','$900'],a:1,e:'Revenue = tariff per unit × units still imported = 10 × 30 = $300.'},
 {q:'The dollar appreciates against the euro. US exports to Europe tend to:',o:['Fall, because US goods cost more euros','Rise, because US goods cost fewer euros','Stay the same','Become free'],a:0,e:'A stronger dollar buys more euros, so a US good\'s euro price rises and Europeans buy less.'},
 {q:'A country imports more than it exports. Its net exports are:',o:['Positive (a trade surplus)','Negative (a trade deficit)','Zero','Equal to GDP'],a:1,e:'NX = exports − imports, which is negative here.'}],
 cards:[['Tariff','A tax on imported goods.'],['Quota','A legal limit on the quantity of a good that can be imported.'],['Import / Export','A good bought from abroad / a good sold abroad.'],['Net exports (NX)','Exports minus imports.'],['Trade deficit','Imports exceed exports (NX &lt; 0).'],['Exchange rate','The price of one currency in terms of another.'],['Appreciation','A currency buys more of another currency; its goods get pricier abroad.'],['Depreciation','A currency buys less of another currency; its goods get cheaper abroad.'],['Terms of trade','The rate at which one country\'s goods trade for another\'s.'],['World price','The price of a good in the global market, taken as given by a small country.']]}
];

const EXTRA={
 m1:"<div class=\"card\"><h3 style=\"margin-top:0\">Worked example: Budget and opportunity cost</h3><p>You have $60. Tickets cost $10 and snacks cost $5. You can afford 6 tickets, or 12 snacks, or any mix on the line between. One ticket costs 2 snacks (10 ÷ 5), so the line's slope is −2. If income rises to $90, the line shifts out: 9 tickets or 18 snacks, same slope.</p><div class=\"key\"><b>Common exam traps</b><ul><li>Absolute vs comparative advantage: compare opportunity costs, not total output.</li><li>Sunk costs (already paid) do not belong in a forward-looking decision.</li><li>A price change <i>rotates</i> the budget line; an income change <i>shifts</i> it.</li></ul></div></div>",
 m2:"<div class=\"card\"><h3 style=\"margin-top:0\">Worked example: Marginal cost vs price</h3><p>Producing 10 units costs $150 and 11 units cost $168, so the 11th unit has MC = $18. The price is $20. Selling one more adds $20 of revenue for $18 of cost, so produce it. Keep going until MC rises to $20.</p><div class=\"key\"><b>Common exam traps</b><ul><li>Accounting profit ignores implicit costs; economic profit subtracts them.</li><li>The short-run shutdown test compares P with <b>AVC</b>, not ATC.</li><li>MC crosses ATC and AVC at their <i>minimums</i>.</li></ul></div></div>",
 m3:"<div class=\"card\"><h3 style=\"margin-top:0\">Worked example: Elasticity and revenue (midpoint method)</h3><p>Price rises from $10 to $12 and quantity falls from 100 to 80. %ΔQ = −20/90 = −22.2%; %ΔP = 2/11 = 18.2%. Elasticity = 22.2/18.2 ≈ 1.22, which is elastic. Revenue falls from $1,000 (10×100) to $960 (12×80).</p><div class=\"key\"><b>Common exam traps</b><ul><li>Price changes cause movements <i>along</i> a curve; other factors <i>shift</i> it.</li><li>A price ceiling only matters if it is below equilibrium (a floor if above).</li><li>'Demand' is the whole curve; 'quantity demanded' is one point on it.</li></ul></div></div>",
 m4:"<div class=\"card\"><h3 style=\"margin-top:0\">Worked example: Monopoly vs competition</h3><p>Demand P = 100 − Q, MC = 20. Monopoly: MR = 100 − 2Q = 20, so Q = 40, P = 60, profit = (60 − 20) × 40 = $1,600. Competition: P = MC = 20, so Q = 80. Deadweight loss = ½ × (80 − 40) × (60 − 20) = $800.</p><div class=\"key\"><b>Common exam traps</b><ul><li>A monopolist does not charge the highest possible price; it charges where MR = MC.</li><li>MR is below price because lowering price applies to <i>all</i> units sold.</li><li>Zero economic profit does not mean zero accounting profit.</li></ul></div></div>",
 m5:"<div class=\"card\"><h3 style=\"margin-top:0\">Worked example: Reading inequality</h3><p>Five groups earn 10, 20, 30, 40, 100 (total 200). Shares: 5%, 10%, 15%, 20%, 50%. The richest fifth takes half of all income, so the Lorenz curve bows well below the 45° line. If 3 of 20 households fall below the poverty line, the poverty rate is 15%.</p><div class=\"key\"><b>Common exam traps</b><ul><li>Income is a flow; wealth is a stock (and more unequal).</li><li>Inequality and poverty are different measures: a country can have one without the other.</li><li>A Gini compares the shape of the distribution, not the average income level.</li></ul></div></div>",
 m6:"<div class=\"card\"><h3 style=\"margin-top:0\">Worked example: GDP and growth arithmetic</h3><p>C = 70, I = 20, G = 25, exports = 10, imports = 15 → GDP = 70 + 20 + 25 + (10 − 15) = 110. If nominal GDP grows 5.5% and prices rise 2%, real growth ≈ 3.5%. At 2.5% growth, income doubles in about 70/2.5 = 28 years.</p><div class=\"key\"><b>Common exam traps</b><ul><li>Imports are subtracted in GDP because C, I and G already include imported goods.</li><li>Used goods and pure financial trades are not part of GDP.</li><li>Always compare <i>real</i> values over time.</li></ul></div></div>",
 m7:"<div class=\"card\"><h3 style=\"margin-top:0\">Worked example: Unemployment and inflation numbers</h3><p>Adults 260m, employed 155m, unemployed 7m. Labor force = 162m. Unemployment rate = 7/162 = 4.3%. Participation = 162/260 = 62.3%. A basket costing $200 in the base year and $210 now has CPI = 105, so inflation is 5%. With 4% nominal wage growth, the real wage falls about 1%.</p><div class=\"key\"><b>Common exam traps</b><ul><li>Discouraged workers are not in the labor force, so they don't count as unemployed.</li><li>CPI is a <i>level</i>; inflation is its percent <i>change</i>.</li><li>Convert to real before comparing: real ≈ nominal − inflation.</li></ul></div></div>",
 m8:"<div class=\"card\"><h3 style=\"margin-top:0\">Worked example: Externalities and the multiplier</h3><p>Each unit of a good causes $20 of pollution damage the producer doesn't pay. A Pigouvian tax of $20 per unit makes the producer face the full social cost. With MPC = 0.75 the simple multiplier is 1/(1 − 0.75) = 4, so $100b of new spending raises GDP by about $400b.</p><div class=\"key\"><b>Common exam traps</b><ul><li>A public good is non-rival and non-excludable, not just government-provided.</li><li>Real-world multipliers are smaller than 1/(1 − MPC) because of taxes, imports and crowding out.</li><li>Tax revenue is a transfer; the deadweight loss is the trades that disappear.</li></ul></div></div>",
 m9:"<div class=\"card\"><h3 style=\"margin-top:0\">Worked example: A tariff</h3><p>Demand Qd = 100 − P and supply Qs = 2P − 20; the world price is $20. Free trade: Qd = 80, Qs = 20, imports 60. A $10 tariff lifts the home price to $30: Qd = 70, Qs = 40, imports 30. Tariff revenue = 10 × 30 = $300. Consumers lose 10 × (80 + 70)/2 = $750; producers gain 10 × (20 + 40)/2 = $300; the government gains $300. Net loss = 750 − 300 − 300 = $150, the two triangles (½·10·20 + ½·10·10 = 100 + 50).</p><div class=\"key\"><b>Common exam traps</b><ul><li>Tariff revenue is a transfer to the government, not part of the deadweight loss.</li><li>Consumers lose more than producers and the government gain.</li><li>Appreciation means a currency buys <i>more</i> foreign currency, which makes its exports pricier abroad.</li></ul></div></div>"
};

es the externality uncorrected."], ["That is contractionary policy.", "", "Higher interest rates are contractionary monetary policy.", "Expansionary policy can help in a recession."], ["Moral hazard is risky behavior after being insured.", "", "Free riding concerns public goods.", "Crowding out concerns government borrowing."], ["", "New bills are discretionary, not automatic.", "A rate hike is a deliberate monetary action.", "Tariffs are trade policy."]]};

const PRED={"money": ["With a 10% reserve ratio, a $100 deposit can support how much in total deposits? How much new lending is that?", "$1,000 in total deposits (100 ÷ 0.10), so $900 of new loans is created. The multiplier is 10."], "rate": ["The central bank cuts the interest rate by 1 point. Which way do investment, GDP and bond prices move?", "All three rise. With the defaults, investment rises by $20b, GDP rises by $80b (multiplier 4), and a bond paying $100 in a year goes from $96.15 to $97.09."], "nash": ["In the prisoners' dilemma, is the outcome where both firms cooperate (10, 10) a Nash equilibrium? Then switch games: how many equilibria does each have?", "No: if the other firm cooperates, cheating pays 15 instead of 10. The only equilibrium is (Cheat, Cheat) at 5 each. The Coordination game and the Entry game each have two equilibria."], "solow": ["Raise the saving rate from 30% to 50% (A = 2, δ = 10%). What happens to steady-state capital and output? Does growth continue forever?", "Steady-state capital rises from 36 to 100 and output per worker from 12 to 20, but it is a one-time rise in the level: capital growth fades to zero at the new steady state. Lasting growth needs continuing technological progress."], "adas": ["Move the demand shift to +10. What happens to output and the price level? Then reset it and try a cost shock of +10 instead.", "Demand +10: output 110 and price level 105 (both rise). Cost shock +10: output 90 and price level 105, so output falls while prices rise (stagflation). In the long run, output returns to 100."], "phillips": ["With expected inflation of 3%, unemployment of 3% gives what inflation? Then switch to Long run: what happens to unemployment and inflation?", "Inflation = 3 + 0.5 × (5 − 3) = 4%. In the long run, people expect 4%, the curve shifts up, unemployment returns to 5%, and inflation stays at 4%: no permanent tradeoff."], "tariff": ["Leave the world price at 20 and add a tariff of 10. Does the total gain or lose? Who gains and who loses?", "Total loses $150. Consumers lose $750, home producers gain $300, and the government collects $300 (10 × 30 units). The two triangles are the deadweight loss."], "fx": ["Raise euros per dollar from 1.00 to 1.20. Do US exports to Europe become more or less attractive?", "Less: the $100 US good now costs €120 (was €100), while a €100 European good costs an American only about $83 (was $100). Exports tend to fall, imports tend to rise."], "budget": ["If income doubles and prices stay the same, what happens to the budget line and to the best amount of X?", "The line shifts out in parallel (same slope). With these tastes, spending shares stay fixed, so the best X and Y both double."], "subincome": ["When the price of X falls from $10 to $5, how do the substitution effect (A → B) and income effect (B → C) change X?", "Both increase X! The substitution effect moves along the initial indifference curve toward the cheaper good X (A → B), and the higher purchasing power shifts out to C (B → C)."], "ppf": ["As you make more Food, does each extra unit of Food cost more or fewer Gadgets?", "More: the frontier bows out, so the opportunity cost of Food rises as you specialize."], "advantage": ["Change Ben's coffee per hour to 6. Does Ana still have the comparative advantage in coffee?", "No. Ana's opportunity cost is 3/6 = 0.5 bread per coffee; Ben's is now 2/6 ≈ 0.33, which is lower, so Ben has it."], "production": ["As you decrease α (stronger diminishing returns), what happens to the shape of the total output curve and the MP_L curve?", "Total output bends over more sharply (flattens faster), and the marginal product of labor (MP_L) drops off much more steeply as workers are added."], "costs": ["Raise the price from 20 to 30. Does the profit-maximizing quantity go up, and by how much?", "It rises. P = MC = c + 2dq, so q* = (P − c)/(2d). With c = 5 and d = 0.5, q* goes from 15 to 25."], "scale": ["At small output (e.g. q = 10) vs. large output (e.g. q = 45), which plant size minimizes Average Total Cost?", "At q = 10 the Small plant has the lowest ATC; at q = 45 the Large plant has the lowest ATC due to economies of scale (spreading higher fixed setup over lower per-unit cost)."], "supplydemand": ["Add a $20 tax. Does the buyer's price or the seller's price move more, and what happens to total surplus?", "Buyers pay about $13 more and sellers receive about $7 less, because supply is flatter (more elastic) than demand. Total surplus falls by the deadweight loss."], "elasticity": ["Starting at P = $30 on the demand curve Q = 100 − P, if you raise the price from $30 to $40, does Total Revenue rise or fall?", "It rises (from $2,100 to $2,400) because demand is inelastic (|E| < 1) below the midpoint price of $50. Above $50, raising price lowers revenue."], "incidence": ["Make demand much steeper than supply (less elastic). Who bears more of the tax?", "Buyers. The side that cannot easily change its behavior bears more of the burden."], "pricecontrol": ["If you set a ceiling above the equilibrium price, what happens?", "Nothing: it is not binding. Only a ceiling below equilibrium creates a shortage."], "dilemma": ["If Firm B plays High, what should Firm A do? And if B plays Low?", "Low in both cases: Low is a dominant strategy. The outcome (Low, Low) pays 5 each, worse than (High, High) paying 10 each. That is the dilemma."], "cournot": ["What happens to price and deadweight loss as you go from 1 firm to 10?", "Price falls toward marginal cost, profit shrinks, and deadweight loss falls toward zero."], "pricedisc": ["Switch from Single price to Perfect (1st-degree) price discrimination. What happens to Consumer Surplus, Producer Profit, and Deadweight Loss?", "Consumer Surplus and Deadweight Loss both fall to $0! The monopolist captures the entire total surplus as profit by charging each buyer their exact willingness to pay."], "labordemand": ["If product price P rises from $10 to $15 while wage W stays at $80, what happens to the VMP_L curve and the number of workers hired?", "VMP_L = P × MP_L shifts up, so the firm hires more workers (and earns a larger firm surplus triangle above the wage line)."], "lorenz": ["Press 'High inequality'. What happens to the Lorenz curve and the Gini?", "The curve bows further below the 45° line and the Gini rises (to about 0.46 with these five groups)."], "taxprog": ["In a progressive tax with a $20k exemption and a 25% top marginal rate, is the average tax rate at $80k income equal to 25%?", "No — it is lower than 25% because the first $20k is taxed at 0% and the middle bracket at a lower rate. The average tax rate rises toward the marginal rate as income grows."], "growth": ["Country A grows 2% and B grows 5% from the same start. About how much richer is B after 50 years?", "About 4.3 times: 1.05^50 ≈ 11.5 versus 1.02^50 ≈ 2.7."], "labor": ["If a discouraged worker stops looking for a job, what happens to the unemployment rate?", "It falls, because they leave the labor force, even though no job was created."], "gov": ["What per-unit tax would exactly fix the externality in the first chart?", "A tax equal to the external cost per unit (a Pigouvian tax)."], "crowdingout": ["Increase the government budget deficit from $0b to $200b. What happens to the equilibrium real interest rate and private investment?", "The real interest rate rises and private investment falls (crowding out), though it falls by less than the full $200b deficit because higher rates also attract more private saving."]};

function predictBox(k){const d=PRED[k];if(!d)return document.createElement('span');const b=el('<div class="key"><b>Predict first:</b> '+d[0]+' <button class="btn" style="margin-left:6px">Show answer</button><div style="display:none;margin-top:6px">'+d[1]+'</div></div>').firstChild;const bt=b.querySelector('button'),ans=b.lastChild;bt.onclick=()=>{const o=ans.style.display==='none';ans.style.display=o?'block':'none';bt.textContent=o?'Hide answer':'Show answer'};return b}
// ---------- UI ----------
const nav=document.getElementById('nav'),main=document.getElementById('main');
let cur=null,tab='learn';
try{const sp=store.get('econ-pos',null);if(sp){cur=sp.id==='exam'?{id:'exam'}:MODS.find(m=>m.id===sp.id)||null;if(sp.tab)tab=sp.tab}}catch(e){}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function pct(m){const p=progress[m.id];return p?`<span class="pct" title="Best quiz score">best ${Math.round(p.best/p.total*100)}%</span>`:''}
function renderNav(){
  nav.innerHTML='';
  MODS.forEach(m=>{const on=cur&&cur.id===m.id;const b=el(`<button class="${on?'on':''}" ${on?'aria-current="true"':''}>${m.title}${pct(m)}</button>`).firstChild;b.onclick=()=>{cur=m;tab='learn';render()};nav.appendChild(b)});
  const on=cur&&cur.id==='exam';const x=el(`<button class="${on?'on':''}" ${on?'aria-current="true"':''}>★ Mixed practice exam${pct({id:'exam'})}</button>`).firstChild;x.onclick=()=>{cur={id:'exam'};render()};nav.appendChild(x);
}
function render(){renderNav();resizers=[];main.innerHTML='';store.set('econ-pos',cur?{id:cur.id,tab}:null);if(!cur){home();return}
  if(cur.id==='exam'){exam();return}
  main.appendChild(el(`<p class="lead" style="margin:0">Course topic: ${cur.topic}</p>`));
  const tabs=el('<div class="tabs"></div>').firstChild;
  [['learn','Learn'],['explore','Explore ('+cur.explore.length+')'],['quiz','Quiz ('+cur.quiz.length+')'],['cards','Flashcards ('+cur.cards.length+')']].forEach(([k,l])=>{const b=el(`<button aria-pressed="${tab===k}" class="${tab===k?'on':''}">${l}</button>`).firstChild;b.onclick=()=>{tab=k;render()};tabs.appendChild(b)});
  main.appendChild(tabs);const body=el('<div></div>').firstChild;main.appendChild(body);
  if(tab==='learn'){body.appendChild(el(`<div class="card">${cur.learn}</div>`).firstChild);if(DIAG[cur.id])body.appendChild(el(DIAG[cur.id]).firstChild);if(EXTRA[cur.id])body.appendChild(el(EXTRA[cur.id]).firstChild)}
  if(tab==='explore'){cur.explore.forEach(k=>{body.appendChild(predictBox(k));W[k](body)})}
  if(tab==='quiz')quiz(body,cur.quiz,cur);
  if(tab==='cards')cards(body,cur.cards);
  window.scrollTo(0,0);
}
function home(){
  const done=MODS.filter(m=>progress[m.id]).length,pctDone=Math.round(done/MODS.length*100);
  main.innerHTML=`<h2>Welcome</h2><p class="lead">A self-paced tutor that follows the topics of <b>Intro to Economic Reasoning</b> (ECON BC1003, Barnard College/Columbia; covering micro and macro basics): constraints and preferences, production by firms, market transactions, competition, income distribution, technology and growth, unemployment and inflation, and the government's role. Extra material goes a little beyond that list: AD-AS and the Phillips curve, money and banking, Nash equilibrium, a capital-accumulation model, and a short module on international trade.</p>
  <div class="card"><b>Suggested study loop for each module</b><ol><li><b>Learn</b> the core ideas and visual concept diagrams.</li><li><b>Explore</b> the ${MODS.reduce((s,m)=>s+m.explore.length,0)} interactive graphs and calculators. Before you move a slider, predict what will happen to the curve and the numbers.</li><li><b>Quiz</b> yourself; missed questions are listed with explanations at the end.</li><li>Drill vocabulary with <b>Flashcards</b>, then try the <b>Mixed practice exam</b>.</li></ol>
  <p style="margin-bottom:6px">Progress: <b>${done} of ${MODS.length}</b> modules quizzed (${pctDone}%)</p>
  <div style="height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px"><div style="width:${pctDone}%;height:100%;background:var(--accent);transition:width .3s"></div></div>
  <button class="btn primary" id="go">Start with module 1</button></div>
  <div class="card"><small>Content is aligned to the topic list on the Columbia course listing and standard introductory-economics material (e.g. Mankiw, Krugman/Wells, OpenStax). Your syllabus, textbook and professor's emphasis take priority – use this as a supplement. The official listing doesn't publish a weekly schedule, so modules follow the order of the listed topics.</small></div>`;
  main.querySelector('#go').onclick=()=>{cur=MODS[0];tab='learn';render()};
}
function quiz(host,qs,mod,mixed,all){
  all=all||qs;let i=0,score=0,missed=[];const box=el('<div class="card"></div>').firstChild;host.appendChild(box);
  const byMod={};
  (function show(){
    if(i>=qs.length){const p=Math.round(score/qs.length*100);
      if(mod&&!mod.retry){const o=progress[mod.id];if(!o||score/qs.length>o.best/o.total)progress[mod.id]={best:score,total:qs.length};store.set('econ-progress',progress);renderNav()}
      box.innerHTML=`<h3>Score: ${score}/${qs.length} (${p}%)</h3><p>${p>=80?'Great work!':p>=60?'Getting there – revisit the Learn and Explore tabs.':'Review the Learn tab and try again.'}</p>`;
      if(mixed){const rows=MODS.filter(m=>byMod[m.title]).map(m=>{const v=byMod[m.title];return[m,v,v[0]/v[1]]});
        box.appendChild(el(`<small>Rough signal only: each module has only a few questions in a 12-question exam, and the extra Trade module may not appear.</small>`).firstChild);
        box.appendChild(el(`<table><tr><th>Module</th><th>Correct</th><th></th></tr>${rows.map(([m,v,f])=>`<tr><td>${m.title}</td><td>${v[0]}/${v[1]} (${Math.round(f*100)}%)</td><td>${f<.6?'review':''}</td></tr>`).join('')}</table>`).firstChild);
        const weak=rows.filter(r=>r[2]<.6).sort((a,b)=>(b[1][1]-b[1][0])-(a[1][1]-a[1][0])||a[2]-b[2])[0];
        if(weak){const wb=el(`<button class="btn" style="margin-top:8px">Review weakest: ${weak[0].title}</button>`).firstChild;wb.onclick=()=>{cur=weak[0];tab='learn';render()};box.appendChild(wb)}}
      if(missed.length){box.appendChild(el(`<h3>Review what you missed</h3>`).firstChild);
        missed.forEach(q=>box.appendChild(el(`<div class="key" style="margin-bottom:12px">${q.mod?'<small>'+q.mod+'</small><br>':''}<b>${q.q}</b><br><span style="color:var(--bad)">Your answer: ${q.mine}</span><br><span style="color:var(--good)">Correct answer: ${q.o[q.a]}</span><br>${q.e}${q.w&&q.w[q.mk]?'<br><i>Why your choice is wrong: '+q.w[q.mk]+'</i>':''}</div>`).firstChild))}
      const r=el('<div class="row" style="margin-top:10px"></div>').firstChild;box.appendChild(r);
      const b=el(`<button class="btn primary">${mod&&mod.retry?'Full quiz again':'Retry all (reshuffled)'}</button>`).firstChild;b.onclick=()=>{host.removeChild(box);quiz(host,mixed?pick():shuffle(all),mod&&mod.retry?cur:mod,mixed,all)};r.appendChild(b);
      if(missed.length){const m2=el('<button class="btn">Retry missed only</button>').firstChild;m2.onclick=()=>{host.removeChild(box);quiz(host,shuffle(missed),{retry:true},false,all)};r.appendChild(m2)}
      return}
    const q=qs[i];box.innerHTML=`<small>Question ${i+1} of ${qs.length}</small><h3 style="margin-top:4px">${q.q}</h3>`;
    let done=false;const fb=el('<div aria-live="polite"></div>').firstChild;
    shuffle(q.o.map((t,k)=>[t,k])).forEach(([t,k])=>{const b=el(`<button class="opt">${t}</button>`).firstChild;b.dataset.k=k;b.onclick=()=>{if(done)return;done=true;
      const ok=k===q.a;if(ok)score++;else missed.push({...q,mine:t,mk:k});
      try{let ms=store.get('econ-missed',[]);ms=ms.filter(x=>x!==q.q);if(!ok)ms.push(q.q);store.set('econ-missed',ms)}catch(e){}
      if(q.mod){byMod[q.mod]=byMod[q.mod]||[0,0];byMod[q.mod][1]++;if(ok)byMod[q.mod][0]++}
      b.classList.add(ok?'right':'wrong');box.querySelectorAll('.opt').forEach(o=>{if(+o.dataset.k===q.a)o.classList.add('right');o.disabled=true});
      fb.appendChild(el(`<div class="key">${ok?'Correct. ':'Not quite. '}${q.e}${!ok&&q.w&&q.w[k]?'<br><i>Why your choice is wrong: '+q.w[k]+'</i>':''}</div>`).firstChild);
      const n=el(`<button class="btn primary">${i+1<qs.length?'Next':'See score'}</button>`).firstChild;n.onclick=()=>{i++;show()};fb.appendChild(n);n.focus()};box.appendChild(b)});
    box.appendChild(fb);
  })();
}
const pick=()=>{const ms=store.get('econ-missed',[]),per=MODS.map(m=>shuffle(m.quiz.map(q=>({...q,mod:m.title+(m.id==='m9'?' (extra)':'')})))),core=per.slice(0,8),first=core.map(a=>a[0]),rest=shuffle([...core.flatMap(a=>a.slice(1)),...per[8]]).sort((a,b)=>ms.includes(b.q)-ms.includes(a.q));return shuffle([...first,...rest.slice(0,12-first.length)])};
function exam(){main.appendChild(el('<h2>Mixed practice exam</h2><p class="lead">12 questions: one from each of modules 1-8, plus four more drawn from all questions and favoring ones you missed before. Module 9 (Trade) is an extra beyond the official topic list, so it can appear but is not guaranteed; it is marked (extra). The Nash and capital-accumulation questions sit inside modules 4 and 6. Your best score is saved.</p>'));quiz(main,pick(),{id:'exam'},true)}
function cards(host,list){
  let deck=shuffle(list),i=0,back=false,known=0;const total=list.length;const box=el('<div></div>').firstChild;host.appendChild(box);
  (function show(){
    if(!deck.length){box.innerHTML=`<div class="card"><h3>Deck complete</h3><p>You marked all ${total} cards as known.</p></div>`;const b=el('<button class="btn primary">Start over</button>').firstChild;b.onclick=()=>{deck=shuffle(list);i=0;known=0;back=false;show()};box.appendChild(b);return}
    i%=deck.length;const c=deck[i];box.innerHTML=`<small>${known} of ${total} known · ${deck.length} left · click the card or press Space to flip</small>`;
    const card=el(`<button class="card fc ${back?'back':''}" style="width:100%;font-family:inherit;color:${back?'var(--accent)':'var(--ink)'}" aria-live="polite">${back?c[1]:c[0]}</button>`).firstChild;card.onclick=()=>{back=!back;show();box.querySelector('.fc').focus()};box.appendChild(card);
    const r=el('<div class="row"></div>').firstChild;
    [['Again',()=>{deck.push(deck.splice(i,1)[0]);back=false;show()}],['I knew it',()=>{deck.splice(i,1);known++;back=false;show()}],['← Prev',()=>{i=(i-1+deck.length)%deck.length;back=false;show()}],['Next →',()=>{i=(i+1)%deck.length;back=false;show()}],['Reshuffle',()=>{deck=shuffle(deck);i=0;back=false;show()}]].forEach(([t,f])=>{const b=el(`<button class="btn">${t}</button>`).firstChild;b.onclick=f;r.appendChild(b)});
    box.appendChild(r)})();
}
render();
</script>
